<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Entreprises partenaires</h1>
    <ul>
        {% for entreprise in entreprises %}
        <li>{{ entreprise.nom }} — {{ entreprise.ville }}</li>
        {% empty %}
        <li>Aucune entreprise enregistrée pour le moment.</li>
        {% endfor %}
    </ul>

</body>

</html>
